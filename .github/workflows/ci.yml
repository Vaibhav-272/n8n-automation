# .github/workflows/ci.yml

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:  # Allows manual or API triggering

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run tests
        run: |
          echo "Running CI tests..."
          exit 1  # Simulate failure (replace with real test command)

      - name: Send result to n8n
        if: always()  # Run this step regardless of test result
        run: |
          echo '{
            "repo": "'${{ github.repository }}'",
            "commit": "'${{ github.sha }}'",
            "status": "'${{ job.status }}'",
            "run_id": "'${{ github.run_id }}'",
            "html_url": "https://github.com/'${{ github.repository }}'/actions/runs/'${{ github.run_id }}'"
          }' | curl -X POST https://n8n.itechnotion.dev/webhook/cicd-status \
               -H "Content-Type: application/json" \
               -d @-
