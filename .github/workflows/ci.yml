name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:  # ← ✅ This line is mandatory for dispatching from n8n

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run tests
        run: |
          echo "Running CI tests..."
          exit 1  # Or your actual test command

      - name: Send result to n8n
        if: always()
        run: |
          curl -X POST https://n8n.YOUR_DOMAIN.dev/webhook/cicd-status \
            -H "Content-Type: application/json" \
            -d '{
              "repo": "${{ github.repository }}",
              "commit": "${{ github.sha }}",
              "status": "${{ job.status }}",
              "conclusion": "CI completed",
              "run_id": "${{ github.run_id }}",
              "html_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
