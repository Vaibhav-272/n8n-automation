# .github/workflows/ci.yml

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:  # Required to allow manual or API triggers

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run tests
        run: |
          echo "Running CI tests..."
          exit 1  # Replace with your actual tests

      - name: Send result to n8n
        if: always()  # Run this step even if tests fail
        run: |
          curl -X POST https://n8n.itechnotion.dev/webhook/cicd-status \
            -H "Content-Type: application/json" \
            -d '{
              "repo": "${{ github.repository }}",
              "commit": "${{ github.sha }}",
              "status": "${{ job.status }}",
              "run_id": "${{ github.run_id }}",
              "html_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
